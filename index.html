<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no" />
    <title>SkyCine TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* LG webOS TV Fullscreen Viewport & Base Styles */
      html, body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #07090e;
        color: #f1f5f9;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      /* Hardware Video Player Plane for LG webOS */
      #webos-video-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        z-index: 0;
        pointer-events: none;
        background: #000000;
        display: none;
      }
      #webos-video-element {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      /* Custom TV Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(229, 169, 60, 0.4);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(229, 169, 60, 0.8);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none !important;
      }
      .no-scrollbar {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }
    </style>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <!-- Hardware-Accelerated Video Surface for LG webOS -->
    <div id="webos-video-container">
      <video id="webos-video-element" playsinline></video>
    </div>

    <!-- UI Overlay Mounting Root -->
    <div id="root" style="position: relative; z-index: 10; width: 1920px; height: 1080px; background-color: #07090e;"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
